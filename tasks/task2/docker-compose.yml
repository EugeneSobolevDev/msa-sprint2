version: "3.8"

services:
  monolith:
    build:
      context: ../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090
    depends_on:
      monolith-db:
        condition: service_healthy
      booking-service:
        condition: service_started
    restart: unless-stopped

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: monolith-db
      DB_PORT: 5432
      DB_NAME: hotelio
      DB_USER: hotelio
      DB_PASSWORD: hotelio
      KAFKA_BROKER: kafka:9092
      BOOKING_TOPIC: booking-created
      GRPC_PORT: 9090
    depends_on:
      monolith-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9090:9090"
    networks:
      - hotelio-net
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=:9090" ]
      interval: 10s
      timeout: 5s
      retries: 3

  booking-history-service:
    build:
      context: ./services/booking-history-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: booking-history-db
      DB_PORT: 5432
      DB_NAME: booking-history
      DB_USER: booking-history
      DB_PASSWORD: booking-history
      KAFKA_BROKER: kafka:9092
      BOOKING_TOPIC: booking-created
    depends_on:
      - booking-history-db
      - kafka
    networks:
      - hotelio-net

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d hotelio"]
      interval: 1s
      timeout: 1s
      retries: 60

  booking-history-db:
    image: postgres:15
    container_name: booking-history-db
    environment:
      POSTGRES_DB: booking-history
      POSTGRES_USER: booking-history
      POSTGRES_PASSWORD: booking-history
    ports:
      - "5434:5432"
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  monolith-db-data:

networks:
  hotelio-net:
    external: true
