spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:booking-db}:${DB_PORT:5432}/${DB_NAME:booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  grpc:
    server:
      port: ${GRPC_PORT:9090}

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    topics:
      booking-created: ${BOOKING_TOPIC:booking-created}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true