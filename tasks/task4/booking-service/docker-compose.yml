version: "3.8"

services:
  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: booking-db
      DB_PORT: 5432
      DB_NAME: hotelio
      DB_USER: hotelio
      DB_PASSWORD: hotelio
      KAFKA_BROKER: kafka:9092
      BOOKING_TOPIC: booking-created
      GRPC_PORT: 9090
      HTTP_PORT: 8080
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9090:9090"
      - "8080:8080"
    networks:
      - hotelio-net
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=:9090" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  booking-db:
    image: postgres:15
    container_name: booking-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d hotelio"]
      interval: 1s
      timeout: 1s
      retries: 60

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  booking-db-data:

networks:
  hotelio-net:
    external: true
